<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Connectée - Mon Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        /* Animation de la banderole */
        @keyframes marquee { 
            0% { transform: translateX(0%); } 
            100% { transform: translateX(-50%); } 
        }
        .animate-marquee { 
            display: inline-block; 
            white-space: nowrap; 
            animation: marquee 18s linear infinite; 
        }
        .animate-marquee:hover { 
            animation-play-state: paused; 
        }

        /* Effet Arc-en-ciel */
        .text-rainbow { 
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6, #34d399, #60a5fa); 
            background-size: 200% auto; 
            -webkit-background-clip: text; 
            background-clip: text; 
            -webkit-text-fill-color: transparent; 
            animation: rainbow-shift 6s linear infinite, marquee 18s linear infinite; 
        }
        @keyframes rainbow-shift { 
            0% { background-position: 0% center; } 
            100% { background-position: 200% center; } 
        }

        /* Effet Néon */
        .neon-glow { 
            text-shadow: 0 0 8px currentColor, 0 0 20px currentColor, 0 0 30px currentColor; 
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Emplacement réservé pour le Header commun (injecté par main.js) -->
    <div id="header-placeholder"></div>

    <!-- Contenu spécifique à la page Home Assistant -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
        
        <!-- Alerte si non configuré -->
        <div id="ha-warning" class="hidden bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl">⚠️</span>
                <p class="text-xs text-amber-600 dark:text-amber-400 font-medium">Veuillez configurer votre URL Tailscale Funnel et votre jeton d'accès API pour piloter vos équipements.</p>
            </div>
            <button onclick="openHaConfigModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1.5 rounded-xl font-semibold cursor-pointer">Configurer</button>
        </div>

        <!-- En-tête de section -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-xl">🏠</span>
                <h2 class="text-xl font-bold">Appareils connectés (Home Assistant)</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddButtonModal()" class="px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors cursor-pointer shadow-sm flex items-center gap-1.5"><span>➕</span> Ajouter un bouton</button>
                <button onclick="openHaConfigModal()" class="px-3 py-2 rounded-xl bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 text-xs font-semibold transition-colors cursor-pointer flex items-center gap-1.5"><span>⚙️</span> Config HA</button>
            </div>
        </div>

        <!-- Grille des widgets / boutons dynamiques -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="custom-devices-grid">
            <!-- Rempli automatiquement -->
        </div>

    </main>

    <!-- Emplacement réservé pour le Footer commun -->
    <div id="footer-placeholder"></div>

    <!-- Script principal partagé et logique Home Assistant -->
    <script src="js/main.js"></script>
    <script src="js/homeassistant.js"></script>
</body>
</html>
