<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Just Go - Home Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-white h-screen w-screen overflow-hidden flex flex-col transition-colors">

    <!-- 1. EN-TÊTE DU SITE -->
    <header class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex items-center justify-between shadow-md z-20">
        <div class="flex items-center gap-3">
            <span class="text-xl">🏠</span>
            <h1 class="font-bold text-sm tracking-wide">Home Assistant - Contrôle Maison</h1>
        </div>
        <div class="flex items-center gap-3">
            <!-- Bouton pour configurer l'URL de votre Home Assistant -->
            <button onclick="configurerUrlHA()" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors" title="Changer l'URL Home Assistant">⚙️ URL</button>
            <a href="index.html" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors">
                Accueil
            </a>
        </div>
    </header>

    <!-- 2. CONTENEUR IFRAME LOVELACE -->
    <main class="flex-1 relative bg-white dark:bg-gray-900">
        <iframe id="ha-iframe" src="" class="w-full h-full border-none" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        
        <!-- Message de secours si l'URL n'est pas configurée -->
        <div id="ha-placeholder" class="absolute inset-0 flex flex-col items-center justify-center gap-4 p-6 text-center bg-gray-100 dark:bg-gray-950">
            <span class="text-4xl">🏡</span>
            <h2 class="text-base font-bold">Home Assistant n'est pas encore configuré</h2>
            <p class="text-xs text-gray-500 max-w-sm">Cliquez sur le bouton ci-dessous pour entrer l'adresse IP locale ou externe de votre serveur Home Assistant (ex: http://homeassistant.local:8123).</p>
            <button onclick="configurerUrlHA()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-lg transition-colors">Définir l'URL Home Assistant</button>
        </div>
    </main>

    <!-- Script de gestion de l'URL -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            chargerIframeHA();
        });

        function chargerIframeHA() {
            const url = localStorage.getItem('ha_url');
            const iframe = document.getElementById('ha-iframe');
            const placeholder = document.getElementById('ha-placeholder');

            if (url) {
                iframe.src = url;
                iframe.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                iframe.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        function configurerUrlHA() {
            const actuelle = localStorage.getItem('ha_url') || 'http://homeassistant.local:8123';
            const nouvelleUrl = prompt("Entrez l'URL de votre Home Assistant (ex: http://192.168.1.50:8123 ou votre Nabu Casa) :", actuelle);
            
            if (nouvelleUrl) {
                localStorage.setItem('ha_url', nouvelleUrl.trim());
                chargerIframeHA();
            }
        }
    </script>
</body>
</html>
