<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Just Go - Maison Connectée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-white h-screen w-screen overflow-hidden flex flex-col transition-colors">

    <!-- 1. EN-TÊTE DU SITE -->
    <header class="bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex items-center justify-between shadow-md z-20">
        <div class="flex items-center gap-3">
            <span class="text-xl">🏠</span>
            <h1 class="font-bold text-sm tracking-wide">Maison Connectée (Home Assistant)</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openHaConfigModal()" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1"><span>⚙️</span> Configuration</button>
            <a href="index.html" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors">
                Accueil
            </a>
        </div>
    </header>

    <!-- 2. CONTENU PRINCIPAL : GRILLE DE CONTRÔLE -->
    <main class="flex-1 p-6 overflow-y-auto flex flex-col gap-6">
        
        <!-- Alerte si non configuré -->
        <div id="ha-warning" class="hidden bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl">⚠️</span>
                <p class="text-xs text-amber-600 dark:text-amber-400 font-medium">Veuillez configurer votre URL Tailscale et votre jeton d'accès API.</p>
            </div>
            <button onclick="openHaConfigModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1.5 rounded-xl font-semibold">Configurer</button>
        </div>

        <!-- Grille des Appareils / Actions Rapides -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="devices-grid">
            
            <!-- Exemple 1 : Éclairage Salon -->
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm flex flex-col justify-between gap-4">
                <div class="flex items-center justify-between">
                    <span class="text-2xl">💡</span>
                    <span id="status-light-salon" class="text-[10px] font-bold px-2 py-1 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400">Chargement...</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Lumière Salon</h3>
                    <p class="text-xs text-gray-500">Éclairage principal</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="controlerAppareil('light.salon', 'light/turn_on')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-xl text-xs font-semibold transition-colors">Allumer</button>
                    <button onclick="controlerAppareil('light.salon', 'light/turn_off')" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2 rounded-xl text-xs font-semibold transition-colors">Éteindre</button>
                </div>
            </div>

            <!-- Exemple 2 : Portail / Porte de Garage -->
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm flex flex-col justify-between gap-4">
                <div class="flex items-center justify-between">
                    <span class="text-2xl">🚪</span>
                    <span id="status-portail" class="text-[10px] font-bold px-2 py-1 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400">Prêt</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Portail Extérieur</h3>
                    <p class="text-xs text-gray-500">Ouverture / Fermeture</p>
                </div>
                <div>
                    <button onclick="controlerAppareil('cover.portail', 'cover/toggle')" class="w-full bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2.5 rounded-xl text-xs font-semibold transition-colors">Basculer (Ouvrir/Fermer)</button>
                </div>
            </div>

            <!-- Exemple 3 : Chauffage / Thermostat -->
            <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-5 rounded-2xl shadow-sm flex flex-col justify-between gap-4">
                <div class="flex items-center justify-between">
                    <span class="text-2xl">🌡️</span>
                    <span id="status-climate" class="text-[10px] font-bold px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-500">Actif</span>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-900 dark:text-white">Chauffage Maison</h3>
                    <p class="text-xs text-gray-500">Mode confort</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="controlerAppareil('climate.maison', 'climate/turn_on')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl text-xs font-semibold transition-colors">Activer</button>
                    <button onclick="controlerAppareil('climate.maison', 'climate/turn_off')" class="flex-1 bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 py-2 rounded-xl text-xs font-semibold transition-colors">Couper</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Script de gestion API REST Home Assistant -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            verifierConfiguration();
            chargerEtatsAppareils();
        });

        function verifierConfiguration() {
            const url = localStorage.getItem('ha_url');
            const token = localStorage.getItem('ha_token');
            const warning = document.getElementById('ha-warning');
            if (!url || !token) {
                warning.classList.remove('hidden');
            } else {
                warning.classList.add('hidden');
            }
        }

        function openHaConfigModal() {
            let modal = document.getElementById('ha-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'ha-modal';
                modal.className = 'fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4';
                modal.innerHTML = `
                    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-6 max-w-md w-full shadow-2xl flex flex-col gap-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-2"><span>⚙️</span> Configuration Home Assistant</h3>
                            <button onclick="document.getElementById('ha-modal').remove()" class="text-gray-400 hover:text-gray-600 text-sm font-bold">×</button>
                        </div>
                        <div class="flex flex-col gap-3 text-xs">
                            <div class="flex flex-col gap-1">
                                <label class="font-semibold text-gray-700 dark:text-gray-300">URL Tailscale Funnel</label>
                                <input type="text" id="input-ha-url" placeholder="https://votre-machine.ts.net" class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-900 dark:text-white outline-none">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="font-semibold text-gray-700 dark:text-gray-300">Jeton d'accès longue durée (Token)</label>
                                <input type="password" id="input-ha-token" placeholder="eyJhbGciOi..." class="bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-gray-900 dark:text-white outline-none">
                            </div>
                        </div>
                        <div class="flex gap-2 mt-2">
                            <button onclick="document.getElementById('ha-modal').remove()" class="flex-1 bg-gray-200 dark:bg-gray-800 py-2 rounded-lg text-xs font-semibold">Annuler</button>
                            <button onclick="sauvegarderConfigHA()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-xs font-semibold">Enregistrer</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            document.getElementById('input-ha-url').value = localStorage.getItem('ha_url') || '';
            document.getElementById('input-ha-token').value = localStorage.getItem('ha_token') || '';
        }

        function sauvegarderConfigHA() {
            const url = document.getElementById('input-ha-url').value.trim().replace(/\/$/, ''); // Supprime le slash de fin si présent
            const token = document.getElementById('input-ha-token').value.trim();

            localStorage.setItem('ha_url', url);
            localStorage.setItem('ha_token', token);

            document.getElementById('ha-modal').remove();
            verifierConfiguration();
            chargerEtatsAppareils();
            alert("Configuration enregistrée !");
        }

        // --- ENVOI DE COMMANDE À HOME ASSISTANT ---
        async function controlerAppareil(entityId, servicePath) {
            const haUrl = localStorage.getItem('ha_url');
            const haToken = localStorage.getItem('ha_token');

            if (!haUrl || !haToken) {
                alert("Veuillez d'abord configurer votre URL et votre Jeton.");
                openHaConfigModal();
                return;
            }

            try {
                const response = await fetch(`${haUrl}/api/services/${servicePath}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${haToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ entity_id: entityId })
                });

                if (response.ok) {
                    console.log(`Commande ${servicePath} envoyée pour ${entityId}`);
                    setTimeout(chargerEtatsAppareils, 1000); // Rafraîchit l'état après 1 seconde
                } else {
                    alert("Erreur lors de l'exécution de la commande par Home Assistant.");
                }
            } catch (error) {
                console.error("Erreur réseau:", error);
                alert("Impossible de joindre Home Assistant via le Funnel Tailscale.");
            }
        }

        // --- CHARGEMENT DES ÉTATS DES APPAREILS ---
        async function chargerEtatsAppareils() {
            const haUrl = localStorage.getItem('ha_url');
            const haToken = localStorage.getItem('ha_token');
            if (!haUrl || !haToken) return;

            try {
                const response = await fetch(`${haUrl}/api/states`, {
                    headers: {
                        'Authorization': `Bearer ${haToken}`,
                        'Content-Type': 'application/json',
                    }
                });

                if (response.ok) {
                    const states = await response.json();
                    
                    // Exemple de mise à jour dynamique pour les entités de votre choix
                    states.forEach(entite => {
                        if (entite.entity_id === 'light.salon') {
                            const badge = document.getElementById('status-light-salon');
                            if (badge) {
                                badge.innerText = entite.state === 'on' ? 'Allumé' : 'Éteint';
                                badge.className = entite.state === 'on' 
                                    ? 'text-[10px] font-bold px-2 py-1 rounded-full bg-blue-500/10 text-blue-500' 
                                    : 'text-[10px] font-bold px-2 py-1 rounded-full bg-gray-200 dark:bg-gray-800 text-gray-500';
                            }
                        }
                    });
                }
            } catch (e) {
                console.warn("Impossible de synchroniser les états Home Assistant", e);
            }
        }
    </script>
</body>
</html>
