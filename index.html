<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Mon Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <!-- SortableJS (glisser-déposer des raccourcis) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <!-- Les styles de banderole (marquee / rainbow / neon) sont désormais
         centralisés dans css/style.css : plus besoin de les dupliquer ici. -->
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-screen overflow-hidden flex flex-col font-sans transition-colors duration-200">

    <!-- Emplacement réservé pour le Header commun -->
    <div id="header-placeholder"></div>

    <!-- Contenu spécifique à cette page -->
    <main class="flex-1 relative min-h-0">
        <!-- Fond : le dashboard Home Assistant en plein écran -->
        <iframe id="ha-frame" title="Home Assistant" class="absolute inset-0 w-full h-full border-0 bg-gray-900" allow="fullscreen"></iframe>

        <!-- Saisie de l'adresse du dashboard (première utilisation) -->
        <div id="ha-setup" class="hidden absolute inset-0 z-10 bg-gray-950/95 flex items-center justify-center p-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl flex flex-col gap-3 text-sm text-gray-300">
                <h2 class="text-lg font-bold text-white">🏠 Adresse de ton dashboard Home Assistant</h2>
                <input id="ha-url-input" type="text" placeholder="https://ton-ha.ts.net/lovelace/0"
                    class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white outline-none focus:border-blue-500">
                <p id="ha-setup-error" class="hidden text-xs text-red-400"></p>
                <p class="text-xs text-gray-400">Si l'écran reste vide, Home Assistant interdit l'affichage dans un autre site. Dans <code>configuration.yaml</code> :</p>
                <pre class="bg-gray-800 rounded-lg p-2 text-xs text-emerald-300">http:\n  use_x_frame_options: false</pre>
                <div class="flex gap-2">
                    <button id="ha-setup-cancel" class="hidden flex-1 bg-gray-800 hover:bg-gray-700 py-2 rounded-lg font-semibold">Annuler</button>
                    <button id="ha-setup-save" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-semibold">Enregistrer</button>
                </div>
            </div>
        </div>

        <!-- Boutons flottants -->
        <div class="absolute bottom-4 left-4 z-20 flex items-center gap-2">
            <button id="btn-widgets" class="bg-gray-900/90 hover:bg-gray-800 text-white px-4 py-3 rounded-full shadow-lg text-sm font-semibold backdrop-blur border border-gray-700">🧩 Widgets</button>
            <button id="btn-ha-reload" class="bg-gray-900/90 hover:bg-gray-800 text-white w-12 h-12 rounded-full shadow-lg backdrop-blur border border-gray-700" title="Recharger">🔄</button>
            <a id="btn-ha-open" target="_blank" rel="noopener noreferrer" class="bg-gray-900/90 hover:bg-gray-800 text-white w-12 h-12 rounded-full shadow-lg backdrop-blur border border-gray-700 flex items-center justify-center" title="Ouvrir dans un onglet">↗</a>
            <button id="btn-ha-config" class="bg-gray-900/90 hover:bg-gray-800 text-white w-12 h-12 rounded-full shadow-lg backdrop-blur border border-gray-700" title="Changer l'adresse">⚙️</button>
        </div>

        <!-- Panneau Widgets (météo + raccourcis) -->
        <aside id="widgets-panel" class="hidden absolute bottom-20 left-4 z-20 w-[28rem] max-w-[92vw] max-h-[75%] overflow-y-auto bg-gray-100/95 dark:bg-gray-950/95 backdrop-blur rounded-2xl shadow-2xl border border-gray-300 dark:border-gray-800 p-4 flex flex-col gap-4">
<!-- WIDGET MÉTÉO -->
<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between gap-4">
    
    <!-- En-tête du widget -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-xl">🌤️</span>
            <h3 id="weather-city" class="text-sm font-bold text-gray-800 dark:text-white">Chargement...</h3>
        </div>
        <span id="weather-icon" class="text-3xl">⏳</span>
    </div>

    <!-- Température et description -->
    <div class="flex items-baseline justify-between">
        <div>
            <span id="weather-temp" class="text-4xl font-black text-gray-900 dark:text-white">--°C</span>
            <p id="weather-desc" class="text-xs text-gray-500 dark:text-gray-400">Analyse du temps...</p>
        </div>
        <div class="text-right flex flex-col gap-0.5 text-xs text-gray-500 dark:text-gray-400">
            <span>Vent : <strong id="weather-wind" class="text-gray-800 dark:text-gray-200">-- km/h</strong></span>
            <span>Pluie : <strong id="weather-rain" class="text-gray-800 dark:text-gray-200">-- mm</strong></span>
        </div>
    </div>

    <!-- Prévisions sur 3 jours -->
    <div class="border-t border-gray-100 dark:border-gray-800 pt-3 flex justify-between items-center" id="weather-forecast">
        <!-- Rempli automatiquement par le script -->
    </div>

</div>
<div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
        <span class="text-xl">🔗</span>
        <h3 class="text-lg font-bold">Mes raccourcis</h3>
    </div>
    <button onclick="openAddShortcutModal('justin_shortcuts')" class="admin-only px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors cursor-pointer shadow-sm flex items-center gap-1.5"><span>➕</span> Ajouter un raccourci</button>
</div>
<div id="shortcuts-grid" class="grid grid-cols-3 gap-3 min-h-[150px]"></div>
        </aside>
    </main>

    <!-- Emplacement réservé pour le Footer commun -->
    <div id="footer-placeholder"></div>

    <!-- Script principal partagé -->
    <script src="js/main.js"></script>
    <script src="js/home-bg.js"></script>
</body>
</html>
