<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Mon Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <!-- SortableJS (glisser-déposer des raccourcis) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <!-- Les styles de banderole (marquee / rainbow / neon) sont désormais
         centralisés dans css/style.css : plus besoin de les dupliquer ici. -->
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Emplacement réservé pour le Header commun -->
    <div id="header-placeholder"></div>

    <!-- Contenu spécifique à cette page -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
<!-- WIDGET MÉTÉO -->
<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between gap-4">
    
    <!-- En-tête du widget -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-xl">🌤️</span>
            <h3 id="weather-city" class="text-sm font-bold text-gray-800 dark:text-white">Chargement...</h3>
        </div>
        <span id="weather-icon" class="text-3xl">⏳</span>
    </div>

    <!-- Température et description -->
    <div class="flex items-baseline justify-between">
        <div>
            <span id="weather-temp" class="text-4xl font-black text-gray-900 dark:text-white">--°C</span>
            <p id="weather-desc" class="text-xs text-gray-500 dark:text-gray-400">Analyse du temps...</p>
        </div>
        <div class="text-right flex flex-col gap-0.5 text-xs text-gray-500 dark:text-gray-400">
            <span>Vent : <strong id="weather-wind" class="text-gray-800 dark:text-gray-200">-- km/h</strong></span>
            <span>Pluie : <strong id="weather-rain" class="text-gray-800 dark:text-gray-200">-- mm</strong></span>
        </div>
    </div>

    <!-- Prévisions sur 3 jours -->
    <div class="border-t border-gray-100 dark:border-gray-800 pt-3 flex justify-between items-center" id="weather-forecast">
        <!-- Rempli automatiquement par le script -->
    </div>

</div>
<div class="flex items-center justify-between">
    <div class="flex items-center gap-2">
        <span class="text-xl">🔗</span>
        <h3 class="text-lg font-bold">Mes raccourcis</h3>
    </div>
    <button onclick="openAddShortcutModal('justin_shortcuts')" class="admin-only px-3 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition-colors cursor-pointer shadow-sm flex items-center gap-1.5"><span>➕</span> Ajouter un raccourci</button>
</div>
<div id="shortcuts-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 min-h-[150px]"></div>
    </main>

    <!-- Emplacement réservé pour le Footer commun -->
    <div id="footer-placeholder"></div>

    <!-- Script principal partagé -->
    <script src="js/main.js"></script>
</body>
</html>
