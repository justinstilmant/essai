<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Mon Dashboard</title>
    <!-- Tailwind CSS[cite: 1] -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
    <script> tailwind.config = { darkMode: 'class' } </script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Firebase SDK[cite: 1] -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes marquee { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .animate-marquee { display: inline-block; white-space: nowrap; animation: marquee 18s linear infinite; }
        .animate-marquee:hover { animation-play-state: paused; }
        .text-rainbow { background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6, #34d399, #60a5fa); background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text; animation: rainbow-shift 6s linear infinite; }
        @keyframes rainbow-shift { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .neon-glow { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
    </style>
<style>
    /* Animation de la banderole */
    @keyframes marquee { 
        0% { transform: translateX(0%); } 
        100% { transform: translateX(-50%); } 
    }
    .animate-marquee { 
        display: inline-block; 
        white-space: nowrap; 
        animation: marquee 18s linear infinite; 
    }
    .animate-marquee:hover { 
        animation-play-state: paused; 
    }

    /* Effet Arc-en-ciel corrigé */
    .text-rainbow { 
        background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6, #34d399, #60a5fa); 
        background-size: 200% auto; 
        -webkit-background-clip: text; 
        background-clip: text; 
        -webkit-text-fill-color: transparent; 
        animation: rainbow-shift 6s linear infinite, marquee 18s linear infinite; 
    }
    @keyframes rainbow-shift { 
        0% { background-position: 0% center; } 
        100% { background-position: 200% center; } 
    }

    /* Effet Néon corrigé */
    .neon-glow { 
        text-shadow: 0 0 8px currentColor, 0 0 20px currentColor, 0 0 30px currentColor; 
    }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = { darkMode: 'class' }
</script>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Emplacement réservé pour le Header commun -->
    <div id="header-placeholder"></div>

    <!-- Contenu spécifique à cette page -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
        <h2 class="text-xl font-bold">Bienvenue sur la page d'accueil</h2>
        <p>Ici, vous mettez le contenu propre à cette page (vos grilles de raccourcis, etc.).</p>
<!-- WIDGET MÉTÉO -->
<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between gap-4">
    
    <!-- En-tête du widget -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="text-xl">🌤️</span>
            <h3 id="weather-city" class="text-sm font-bold text-gray-800 dark:text-white">Chargement...</h3>
        </div>
        <span id="weather-icon" class="text-3xl">⏳</span>
    </div>

    <!-- Température et description -->
    <div class="flex items-baseline justify-between">
        <div>
            <span id="weather-temp" class="text-4xl font-black text-gray-900 dark:text-white">--°C</span>
            <p id="weather-desc" class="text-xs text-gray-500 dark:text-gray-400">Analyse du temps...</p>
        </div>
        <div class="text-right flex flex-col gap-0.5 text-xs text-gray-500 dark:text-gray-400">
            <span>Vent : <strong id="weather-wind" class="text-gray-800 dark:text-gray-200">-- km/h</strong></span>
            <span>Pluie : <strong id="weather-rain" class="text-gray-800 dark:text-gray-200">-- mm</strong></span>
        </div>
    </div>

    <!-- Prévisions sur 3 jours -->
    <div class="border-t border-gray-100 dark:border-gray-800 pt-3 flex justify-between items-center" id="weather-forecast">
        <!-- Rempli automatiquement par le script -->
    </div>

</div>
<div id="shortcuts-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 min-h-[150px]"></div>
    </main>

    <!-- Emplacement réservé pour le Footer commun -->
    <div id="footer-placeholder"></div>

    <!-- Script principal partagé -->
    <script src="js/main.js"></script>
</body>

</html>
