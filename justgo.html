<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Just Go - GPS Tesla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-white h-screen w-screen overflow-hidden relative transition-colors">

    <!-- 1. EN-TÊTE DU SITE (Flottant au-dessus de la carte) -->
    <header class="absolute top-0 left-0 right-0 z-20 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-xl">🚗</span>
            <h1 class="font-bold text-sm tracking-wide">Just Go - Tesla Navigation</h1>
        </div>
        <a href="index.html" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors">
            Accueil
        </a>
    </header>

    <!-- 2. LA CARTE PLEIN ÉCRAN -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 3. BARRE DE RECHERCHE & BOUTONS HAUT -->
    <div class="absolute top-20 left-6 z-10 flex items-center gap-2">
        <input type="text" id="search-input" placeholder="Où allons-nous ?" class="bg-white/90 dark:bg-gray-900/90 backdrop-blur border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-2 text-xs shadow-lg outline-none w-64 text-gray-900 dark:text-white focus:border-blue-500">
        <button onclick="rechercherDestination()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-semibold shadow-lg transition-colors">Go</button>
    </div>

    <div class="absolute top-20 right-6 z-10 flex items-center gap-3">
        <!-- Bouton Configuration API -->
        <button onclick="openApiModal()" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 p-3 rounded-full backdrop-blur border border-gray-300 dark:border-gray-700 shadow-lg text-lg transition-colors" title="Configurer les clés API">⚙️</button>
        <button id="btn-mute" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 p-3 rounded-full backdrop-blur border border-gray-300 dark:border-gray-700 shadow-lg text-lg transition-colors">🔊</button>
        <button id="btn-stop" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-xl backdrop-blur font-bold text-sm text-white shadow-lg transition-colors">Arrêter</button>
    </div>

    <!-- 4. VITESSE, PANNEAU DE SIGNALISATION & FAVORIS (Bas à gauche) -->
    <div class="absolute bottom-6 left-6 z-10 flex items-end gap-4">
        <!-- Compteur de vitesse -->
        <div id="speedometer" class="w-24 h-24 rounded-full bg-white/90 dark:bg-gray-900/90 border-4 border-gray-300 dark:border-gray-700 flex flex-col items-center justify-center shadow-2xl transition-all relative">
            <span id="current-speed" class="text-2xl font-black">0</span>
            <span class="text-[10px] text-gray-500 uppercase tracking-wider">km/h</span>
            
            <!-- Panneau de limitation de vitesse (Style Tesla) -->
            <div id="speed-limit-sign" class="absolute -top-3 -right-3 hidden items-center justify-center w-10 h-10 bg-white border-3 border-red-600 rounded-full shadow-lg font-bold text-gray-900 text-xs">
                <span id="speed-limit-value">50</span>
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <button onclick="naviguerVers('Domicile', 50.8503, 4.3517)" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-1.5 transition-colors">
                <span>🏠</span> Domicile
            </button>
            <button onclick="naviguerVers('Travail', 50.8466, 4.3528)" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-1.5 transition-colors">
                <span>💼</span> Travail
            </button>
        </div>
    </div>

    <!-- 5. ENCART D'INFORMATIONS ROUTE (Bas à droite) -->
    <div class="absolute bottom-6 right-6 z-10 bg-white/90 dark:bg-gray-900/90 backdrop-blur border border-gray-300 dark:border-gray-700 rounded-2xl p-4 shadow-2xl w-80 flex flex-col gap-3 text-xs transition-colors">
        <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-2">
            <span class="font-bold flex items-center gap-1.5"><span>📊</span> Infos Navigation</span>
            <span id="gps-weather-badge" class="text-sm">⛅ --°C</span>
        </div>
        <div class="flex flex-col gap-1.5 text-gray-600 dark:text-gray-300">
            <div class="flex justify-between">
                <span>Itinéraire (OSRM) :</span>
                <span id="info-route" class="font-semibold text-gray-900 dark:text-white">En attente de destination</span>
            </div>
            <div class="flex justify-between">
                <span>Trafic (TomTom) :</span>
                <span id="info-traffic" class="font-semibold text-emerald-500">Fluide (Clé requise)</span>
            </div>
        </div>
    </div>

    <!-- Scripts externes -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/main.js"></script>
    <script src="js/justgo.js"></script>
</body>
</html>
