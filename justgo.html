<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Just Go - GPS Tesla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Firebase SDK (obligatoire : main.js en dépend dès sa première ligne,
         sans ces scripts la page plantait et le verrouillage par mot de passe
         était contourné) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <style>
        .rbtn{width:2.5rem;height:2.5rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:rgba(17,24,39,.92);color:#fff;border:1px solid #374151;box-shadow:0 4px 10px rgba(0,0,0,.4);flex-shrink:0;cursor:pointer}
        .rbtn:hover{background:#1f2937}
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-900 dark:text-white h-screen w-screen overflow-hidden relative transition-colors">

    <!-- 1. EN-TÊTE DU SITE (Flottant au-dessus de la carte) -->
    <header class="absolute top-0 left-0 right-0 z-20 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-3 flex items-center gap-4 shadow-md">
        <div class="flex items-center gap-3">
            <span class="text-xl">🚗</span>
            <h1 class="font-bold text-sm tracking-wide">Just Go - Tesla Navigation</h1>
        </div>
        <a href="index.html" class="text-xs font-semibold bg-gray-200 dark:bg-gray-800 hover:bg-gray-300 dark:hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors">
            Accueil
        </a>
    </header>

    <!-- 2. LA CARTE PLEIN ÉCRAN -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- 3. BARRE DE RECHERCHE & BOUTONS HAUT -->
    <div id="search-wrap" class="absolute top-20 left-6 z-30">
        <div class="flex items-center gap-2">
            <input type="text" id="search-input" autocomplete="off" placeholder="Où allons-nous ?" class="bg-white/90 dark:bg-gray-900/90 backdrop-blur border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 text-sm shadow-lg outline-none w-72 text-gray-900 dark:text-white focus:border-blue-500">
            <button onclick="rechercherDestination()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-3 rounded-xl text-sm font-semibold shadow-lg transition-colors">Go</button>
        </div>
        <div id="search-suggest" class="hidden mt-1 w-[min(26rem,92vw)] bg-gray-900/95 text-white rounded-xl shadow-2xl overflow-hidden"></div>
    </div>

    <!-- Barre de boutons sur le bord droit (repliable avec ☰) -->
    <div id="rail" class="absolute right-2 top-24 z-10 flex flex-col items-end gap-2" style="max-height:calc(100vh - 17rem)">
        <button id="rail-toggle" class="rbtn" title="Afficher / masquer les boutons">☰</button>
        <div id="rail-items" class="flex flex-col gap-2 overflow-y-auto pr-0.5">
            <button onclick="openApiModal()" class="rbtn" title="Configurer les clés API">⚙️</button>
            <button id="btn-recenter" onclick="recentrer()" class="rbtn hidden" style="background:#2563eb" title="Recentrer">📍</button>
            <button onclick="basculerTrafic()" class="rbtn" title="Circulation">🚦</button>
            <button onclick="basculerSuperchargeurs()" class="rbtn" title="Superchargeurs">⚡</button>
            <button id="btn-waze" onclick="basculerWaze()" class="rbtn" title="Alertes Waze (police, accidents, dangers)">🚓</button>
            <button id="btn-mute" class="rbtn" title="Voix">🔊</button>
            <button id="btn-stop" class="rbtn" style="background:#dc2626" title="Arrêter la navigation">⏹</button>
        </div>
    </div>

    <!-- 4. VITESSE, PANNEAU DE SIGNALISATION & FAVORIS (Bas à gauche) -->
    <div class="absolute bottom-6 left-6 z-10 flex items-end gap-4">
        <!-- Compteur de vitesse -->
        <div id="speedometer" class="w-24 h-24 rounded-full bg-white/90 dark:bg-gray-900/90 border-4 border-gray-300 dark:border-gray-700 flex flex-col items-center justify-center shadow-2xl transition-all relative">
            <span id="current-speed" class="text-2xl font-black">0</span>
            <span class="text-[10px] text-gray-500 uppercase tracking-wider">km/h</span>
            
            <!-- Panneau de limitation de vitesse (Style Tesla) -->
            <div id="speed-limit-sign" style="border:5px solid #dc2626" class="absolute -top-4 -right-4 hidden items-center justify-center w-14 h-14 bg-white rounded-full shadow-lg font-black text-gray-900 text-lg">
                <span id="speed-limit-value">50</span>
            </div>
        </div>

       <div class="flex flex-col gap-2">
            <div class="flex items-center gap-1">
                <button onclick="naviguerVersFavori('domicile')" class="flex-1 bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-1.5 transition-colors">
                    <span>🏠</span> <span id="label-domicile">Domicile</span>
                </button>
                <button onclick="configurerFavori('domicile')" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 p-1.5 rounded-xl text-xs shadow-lg transition-colors" title="Définir l'adresse">✏️</button>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="naviguerVersFavori('travail')" class="flex-1 bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold shadow-lg flex items-center gap-1.5 transition-colors">
                    <span>💼</span> <span id="label-travail">Travail</span>
                </button>
                <button onclick="configurerFavori('travail')" class="bg-white/90 dark:bg-gray-900/90 hover:bg-gray-200 dark:hover:bg-gray-800 backdrop-blur border border-gray-300 dark:border-gray-700 p-1.5 rounded-xl text-xs shadow-lg transition-colors" title="Définir l'adresse">✏️</button>
            </div>
        </div>
    </div>

    <!-- Choix de l'itinéraire (alternatives) -->
    <div id="route-choice" class="hidden absolute top-36 left-6 z-20 w-80 max-w-[92vw] bg-gray-900/95 text-white rounded-2xl shadow-2xl p-3 flex flex-col gap-2">
        <div class="text-xs font-bold text-gray-300">Choisis ton itinéraire</div>
        <div id="route-cards" class="flex flex-col gap-2"></div>
        <button id="route-go" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm">🚀 Démarrer</button>
    </div>

    <!-- Bandeau de guidage (manœuvre suivante) -->
    <div id="nav-banner" class="hidden absolute top-36 md:top-20 left-1/2 -translate-x-1/2 z-20 bg-gray-900/95 text-white rounded-2xl shadow-2xl px-6 py-3 flex items-center gap-5 max-w-[92vw]">
        <span id="nav-arrow" class="text-5xl leading-none">⬆️</span>
        <div>
            <div id="nav-dist" class="text-3xl font-black">--</div>
            <div id="nav-text" class="text-sm text-gray-300">--</div>
        </div>
    </div>

    <!-- Temps restant / distance / arrivée -->
    <div id="nav-eta" class="hidden absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-gray-900/95 text-white rounded-2xl shadow-2xl px-5 py-2 flex items-center gap-4 text-sm font-semibold">
        <span id="eta-time">--</span><span class="text-gray-500">·</span>
        <span id="eta-dist">--</span><span class="text-gray-500">·</span>
        <span>🏁 <span id="eta-arrival">--:--</span></span>
    </div>

    <!-- 5. ENCART D'INFORMATIONS ROUTE (Bas à droite) -->
    <div class="absolute bottom-4 right-2 z-10 bg-white/90 dark:bg-gray-900/90 backdrop-blur border border-gray-300 dark:border-gray-700 rounded-2xl p-3 shadow-2xl w-72 flex flex-col gap-2 text-xs transition-colors">
        <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-800 pb-2">
            <span class="font-bold flex items-center gap-1.5"><span>📊</span> Infos Navigation</span>
        </div>
        <div class="flex flex-col gap-1.5 text-gray-600 dark:text-gray-300">
            <div class="flex justify-between">
                <span>Itinéraire :</span>
                <span id="info-route" class="font-semibold text-gray-900 dark:text-white">En attente de destination</span>
            </div>
            <div class="flex justify-between">
                <span>Trafic :</span>
                <span id="info-traffic" class="font-semibold">—</span>
            </div>
            <div class="flex justify-between">
                <span>Incidents :</span>
                <span id="info-incidents" class="font-semibold text-gray-900 dark:text-white">—</span>
            </div>
            <div class="flex justify-between gap-2">
                <span>⚡ Supercharger :</span>
                <span id="info-charge" class="font-semibold text-gray-900 dark:text-white text-right truncate">—</span>
            </div>
            <div class="flex justify-between gap-2">
                <span>🚓 Waze :</span>
                <span id="info-waze" class="font-semibold text-gray-500 text-right truncate">Désactivé</span>
            </div>
            <div class="flex justify-between gap-2">
                <span>🔊 Voix :</span>
                <span id="info-voix" class="font-semibold text-right truncate">—</span>
            </div>
        </div>
    </div>

    <!-- Scripts externes -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="js/main.js"></script>
    <script src="js/justgo.js"></script>
</body>
</html>
