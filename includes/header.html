<!-- Modal de Personnalisation Avancée de la Banderole -->
<div id="banner-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl shadow-2xl max-w-md w-full flex flex-col gap-4">
        <h3 class="text-lg font-bold flex items-center gap-2">✨ Personnaliser la Banderole</h3>
        
        <div class="flex flex-col gap-1">
            <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">Texte de la banderole</label>
            <input type="text" id="config-banner-text" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2.5 rounded-lg text-sm w-full outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">Couleur (si effet normal)</label>
                <input type="color" id="config-banner-color" value="#60a5fa" class="h-10 w-full bg-gray-100 dark:bg-gray-700 rounded-lg cursor-pointer p-1">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">Taille du texte</label>
                <select id="config-banner-size" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2.5 rounded-lg text-sm w-full outline-none">
                    <option value="text-xs">Très petit</option>
                    <option value="text-sm">Petit</option>
                    <option value="text-base" selected>Normal</option>
                    <option value="text-lg">Grand</option>
                    <option value="text-xl">Très grand</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">Jeu de lumière / Effet</label>
                <select id="config-banner-effect" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2.5 rounded-lg text-sm w-full outline-none">
                    <option value="normal">Normal (Couleur unie)</option>
                    <option value="rainbow">Arc-en-ciel magique 🌈</option>
                    <option value="neon">Néon lumineux 💡</option>
                </select>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">Vitesse de défilement</label>
                <select id="config-banner-speed" class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2.5 rounded-lg text-sm w-full outline-none">
                    <option value="35s">Très lent</option>
                    <option value="25s">Lent</option>
                    <option value="18s" selected>Normal</option>
                    <option value="10s">Rapide</option>
                    <option value="5s">Très rapide</option>
                </select>
            </div>
        </div>

        <div class="flex gap-2 mt-2">
            <button onclick="sauvegarderConfigBanderole()" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-lg text-sm flex-1 font-semibold">Appliquer & Enregistrer</button>
            <button onclick="fermerModalBandole()" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 p-2.5 rounded-lg text-sm flex-1">Annuler</button>
        </div>
    </div>
</div>

<!-- Modal d'authentification Admin -->
<div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 rounded-2xl shadow-2xl max-w-sm w-full flex flex-col gap-4">
        <h3 class="text-lg font-bold">🔒 Sécurité Admin</h3>
        <p class="text-xs text-gray-500 dark:text-gray-400">Entrez le mot de passe pour déverrouiller les options.</p>
        <input type="password" id="admin-password" placeholder="Mot de passe..." class="bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white p-2.5 rounded-lg text-sm w-full outline-none">
        <div class="flex gap-2">
            <button onclick="verifierAdmin()" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-lg text-sm flex-1">Valider</button>
            <button onclick="fermerAuthModal()" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 p-2 rounded-lg text-sm flex-1">Annuler</button>
        </div>
    </div>
</div>
